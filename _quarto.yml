project:
  type: website
  output-dir: _site
  # Pages live in pages/ but read project-root paths (analysis/, data/, assets/),
  # so run every doc from the project root.
  execute-dir: project
  resources:
    - assets/hexes.geojson   # shared hex geometry the NYC maps fetch by URL

website:
  title: "brainvomit"          # browser-tab text / metadata
  favicon: assets/flower.svg   # 🌸 tab icon
  # High-level sections live in the top navbar; the matching left sidebar shows
  # that section's pages; a page outline appears on the right (toc: true).
  search:
    location: navbar
    type: textbox      # inline box in the navbar, not the overlay popup
  navbar:
    background: primary
    title: "🌸"                # pink-flower brand (emoji as text renders reliably)
    left:
      - text: "About"
        href: index.qmd
      - text: "Case studies"
        href: pages/case-studies.qmd
      - text: "Blog"
        href: pages/blog.qmd
    right:
      - icon: github
        href: https://github.com/vvmai
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/vvmai
        aria-label: LinkedIn
  # Case studies: problem -> solution -> results. Blog: open-ended explorations.
  sidebar:
    - id: case-studies
      title: "Case studies"
      style: docked
      contents:
        - text: "Designing a predictive model controller to optimize a pricing strategy"
          href: pages/pricing-controller.qmd
        - text: "Graph-based entity resolution algorithm"
          href: pages/entity-resolution.qmd
        - text: "Neurosymbolic solver for deductive trading"
          href: pages/neurosymbolic.qmd
    - id: blog
      title: "Blog"
      style: docked
      contents:
        - text: "Quick maths"
          href: pages/quick-maths.qmd
        - text: "Conway's blobs"
          href: pages/blobsim.qmd
        - text: "Plotting my next move"
          href: pages/nyc.qmd
        - text: "Is grad school worth it?"
          href: pages/grad-school.qmd
        - text: "Puppy weight predictor"
          href: pages/puppy.qmd

# Page dates are created_at in US Eastern wall-clock time (no offset, so the
# rendered time is the same on any machine/CI timezone).
date-format: "MMMM D, YYYY h:mm A [ET]"
language:
  title-block-published: ""   # hide the "Published" heading above the date

format:
  html:
    theme: assets/brite.scss
    toc: true

execute:
  # Pages re-execute locally when their source changes; outputs cached in
  # _freeze/ (committed) so CI deploys without geopandas/blobsim or the raw data.
  freeze: auto
